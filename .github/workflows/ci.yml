name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev extras)
        run: uv pip install --system -e '.[dev]'

      - name: Lint
        run: ruff check

      - name: Test
        run: pytest --cov=redharness --cov-report=term-missing

      - name: Offline jailbreak smoke eval (no secrets)
        run: redharness run configs/smoke.yaml

      - name: Offline injection smoke eval (no secrets)
        run: redharness run configs/injection_smoke.yaml

      - name: Offline data-leakage smoke eval (no secrets)
        run: redharness run configs/leakage_smoke.yaml
